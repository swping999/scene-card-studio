name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - if: matrix.python-version == '3.12'
        run: python -m pip install build
      - if: matrix.python-version == '3.12'
        run: python -m build
      - if: matrix.python-version == '3.12'
        name: Verify wheel contains and exposes the Codex Skill
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          expected = ".data/data/share/scene-card-studio/skill/SKILL.md"
          assert any(name.endswith(expected) for name in names), "Wheel is missing the bundled Codex Skill"
          PY
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          skill_path="$(wheel-smoke/bin/scene-card-studio skill-path)"
          test -f "$skill_path/SKILL.md"
